name: Validate and deploy Pages

on:
  pull_request:
    branches: [master]
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: script-reader-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate-build:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      app_changed: ${{ steps.changes.outputs.app_changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2

      - name: Fetch PR base commit
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git fetch --no-tags --depth=1 origin "$BASE_SHA"

      - name: Detect application changes
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -Eeuo pipefail

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base_ref="$PR_BASE_SHA"
          elif git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            base_ref="HEAD^"
          else
            base_ref=""
          fi

          if [[ -n "$base_ref" ]]; then
            printf 'base_ref=%s\n' "$base_ref" >> "$GITHUB_OUTPUT"
          else
            printf 'base_ref=0.0.0\n' >> "$GITHUB_OUTPUT"
          fi

          if [[ "$EVENT_NAME" == "workflow_dispatch" || -z "$base_ref" ]]; then
            printf 'app_changed=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed_files="$(git diff --name-only "$base_ref" HEAD)"
          printf '%s\n' "$changed_files"

          if grep -Eq '^(src/|tests/|public/|index\.html$|package(-lock)?\.json$|vite\.config\.ts$|tsconfig(\.[^.]+)?\.json$)' <<<"$changed_files"; then
            printf 'app_changed=true\n' >> "$GITHUB_OUTPUT"
          else
            printf 'app_changed=false\n' >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node
        if: steps.changes.outputs.app_changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        if: steps.changes.outputs.app_changed == 'true'
        run: npm ci --no-audit --no-fund

      - name: Validate release version
        env:
          RELEASE_BASE_REF: ${{ steps.changes.outputs.base_ref }}
        run: bash scripts/validate-release-version.sh

      - name: Typecheck
        if: github.event_name == 'pull_request' && steps.changes.outputs.app_changed == 'true'
        run: npm run typecheck

      - name: Test
        if: github.event_name == 'pull_request' && steps.changes.outputs.app_changed == 'true'
        run: npm run test:run

      - name: Build
        if: steps.changes.outputs.app_changed == 'true'
        run: npm run build:ci

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/master' && steps.changes.outputs.app_changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && needs.validate-build.outputs.app_changed == 'true'
    needs: validate-build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
