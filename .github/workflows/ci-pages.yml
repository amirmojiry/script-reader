name: Validate and deploy Pages

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

# Bootstrap note: this write permission is temporary while the first PR creates
# package-lock.json. It is reduced to read-only before the PR is review-ready.
permissions:
  contents: write

concurrency:
  group: script-reader-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Detect bootstrap lockfile
        id: lockfile
        shell: bash
        run: |
          if [[ -f package-lock.json ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ steps.lockfile.outputs.present == 'true' && 'package-lock.json' || 'package.json' }}

      - name: Install locked dependencies
        if: steps.lockfile.outputs.present == 'true'
        run: npm ci --no-audit --no-fund

      - name: Bootstrap dependency lockfile
        if: steps.lockfile.outputs.present != 'true'
        run: npm install --no-audit --no-fund

      - name: Validate release version
        run: bash scripts/validate-release-version.sh

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test:run

      - name: Build
        run: npm run build

      - name: Commit bootstrap lockfile
        if: >-
          github.event_name == 'pull_request' &&
          steps.lockfile.outputs.present != 'true' &&
          github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: commit npm lockfile (#2)"
          git push origin "HEAD:${{ github.head_ref }}"

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: validate-build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
